name: PR 180 polish

on:
  push:
    branches:
      - tmp/pr180-polish-20260911

permissions:
  contents: write

jobs:
  rebuild-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild on current upstream main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/pr180-polish.py /tmp/pr180-polish.py
          sed -i 's/        """NAMS feedback exposes only arguments honored by the backend."""/        # NAMS feedback exposes only arguments honored by the backend./' /tmp/pr180-polish.py
          git fetch origin contrib/issue-170-wrapper-semantics
          test "$(git rev-parse FETCH_HEAD)" = "20a969857693f1743a1779dd8431a5a38b62d51d"
          git remote add upstream https://github.com/neo4j-labs/agent-memory.git || true
          git fetch upstream main
          git checkout -B pr180-work upstream/main
          python /tmp/pr180-polish.py
          python - <<'PY'
          from pathlib import Path


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one {label} match, found {count}")
              return text.replace(old, new)


          mcp_path = Path("src/neo4j_agent_memory/mcp/_tools.py")
          mcp_text = mcp_path.read_text(encoding="utf-8")
          mcp_text = replace_once(
              mcp_text,
              "from typing import TYPE_CHECKING, Annotated, Any, Literal, cast",
              "from typing import TYPE_CHECKING, Any, Literal, cast",
              "typing import",
          )
          mcp_text = replace_once(
              mcp_text,
              "from pydantic import Field\n",
              "",
              "pydantic import",
          )
          mcp_text = replace_once(
              mcp_text,
              "limit: Annotated[int, Field(ge=1)] = 50",
              "limit: int = 50",
              "history signature",
          )
          mcp_text = replace_once(
              mcp_text,
              "limit: Annotated[int, Field(ge=1)] = 20",
              "limit: int = 20",
              "reflections signature",
          )
          mcp_text = replace_once(
              mcp_text,
              "            history = (await client.long_term.get_entity_history(entity_id))[:limit]",
              """            if limit < 1:
                raise ValueError("limit must be at least 1")
            history = (await client.long_term.get_entity_history(entity_id))[:limit]""",
              "history validation",
          )
          mcp_text = replace_once(
              mcp_text,
              "            reflections = (await client.short_term.get_reflections(session_id))[:limit]",
              """            if limit < 1:
                raise ValueError("limit must be at least 1")
            reflections = (await client.short_term.get_reflections(session_id))[:limit]""",
              "reflections validation",
          )
          mcp_path.write_text(mcp_text, encoding="utf-8")

          test_path = Path("tests/unit/nams/test_mcp_platinum.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = replace_once(
              test_text,
              """        assert history_limit["default"] == 50
        assert history_limit["minimum"] == 1

        reflections_limit = tools["memory_get_reflections"].inputSchema["properties"]["limit"]
        assert reflections_limit["default"] == 20
        assert reflections_limit["minimum"] == 1

    @pytest.mark.asyncio
    async def test_get_entity_history(self, server, mock_client):
""",
              """        assert history_limit["default"] == 50

        reflections_limit = tools["memory_get_reflections"].inputSchema["properties"]["limit"]
        assert reflections_limit["default"] == 20

    @pytest.mark.asyncio
    async def test_non_positive_limits_are_rejected_before_backend_access(
        self, server, mock_client
    ):
        async with Client(server) as client:
            history_result = await client.call_tool(
                "memory_get_entity_history", {"entity_id": "e1", "limit": 0}
            )
            reflections_result = await client.call_tool(
                "memory_get_reflections", {"session_id": "s1", "limit": -1}
            )

        assert json.loads(history_result.content[0].text) == {
            "error": "limit must be at least 1"
        }
        assert json.loads(reflections_result.content[0].text) == {
            "error": "limit must be at least 1"
        }
        mock_client.long_term.get_entity_history.assert_not_awaited()
        mock_client.short_term.get_reflections.assert_not_awaited()

    @pytest.mark.asyncio
    async def test_get_entity_history(self, server, mock_client):
""",
              "MCP limit tests",
          )
          test_path.write_text(test_text, encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'CHANGELOG.md\nsrc/neo4j_agent_memory/integrations/pydantic_ai/memory.py\nsrc/neo4j_agent_memory/integrations/strands/tools.py\nsrc/neo4j_agent_memory/mcp/_tools.py\ntests/unit/integrations/test_strands.py\ntests/unit/nams/test_mcp_platinum.py\ntests/unit/nams/test_pydantic_ai_nams.py'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install focused dependencies
        run: >-
          uv sync --group dev
          --extra mcp
          --extra nams
          --extra pydantic-ai
          --extra strands

      - name: Format touched Python files
        run: >-
          uv run ruff format
          src/neo4j_agent_memory/integrations/pydantic_ai/memory.py
          src/neo4j_agent_memory/integrations/strands/tools.py
          src/neo4j_agent_memory/mcp/_tools.py
          tests/unit/integrations/test_strands.py
          tests/unit/nams/test_mcp_platinum.py
          tests/unit/nams/test_pydantic_ai_nams.py

      - name: Run focused regression tests
        run: >-
          uv run pytest
          tests/unit/nams/test_mcp_platinum.py
          tests/unit/nams/test_pydantic_ai_nams.py
          tests/unit/integrations/test_strands.py
          -v

      - name: Install full type-check dependencies
        run: uv sync --all-extras --group dev

      - name: Run code-quality gates
        run: make check

      - name: Run complete unit suite
        run: make test-unit

      - name: Build distributions
        run: make build

      - name: Publish one verified feature commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = $'CHANGELOG.md\nsrc/neo4j_agent_memory/integrations/pydantic_ai/memory.py\nsrc/neo4j_agent_memory/integrations/strands/tools.py\nsrc/neo4j_agent_memory/mcp/_tools.py\ntests/unit/integrations/test_strands.py\ntests/unit/nams/test_mcp_platinum.py\ntests/unit/nams/test_pydantic_ai_nams.py'
          git config user.name "Julian"
          git config user.email "148066842+JulianZJN@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            src/neo4j_agent_memory/integrations/pydantic_ai/memory.py \
            src/neo4j_agent_memory/integrations/strands/tools.py \
            src/neo4j_agent_memory/mcp/_tools.py \
            tests/unit/integrations/test_strands.py \
            tests/unit/nams/test_mcp_platinum.py \
            tests/unit/nams/test_pydantic_ai_nams.py
          git diff --cached --check
          git commit -m "fix: align NAMS wrapper tool semantics"
          git push \
            --force-with-lease=refs/heads/contrib/issue-170-wrapper-semantics:20a969857693f1743a1779dd8431a5a38b62d51d \
            origin HEAD:contrib/issue-170-wrapper-semantics
